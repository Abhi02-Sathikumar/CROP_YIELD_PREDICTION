name: Keep Streamlit app awake

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:         # lets you run it manually

jobs:
  visit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit the app
        run: |
          python - <<'EOF'
          from playwright.sync_api import sync_playwright

          URL = "https://crop-yield-prediction-v.streamlit.app/"

          with sync_playwright() as p:
              page = p.chromium.launch().new_page()
              page.goto(URL, timeout=60000)
              # If the app is asleep, click the wake-up button
              btn = page.get_by_text("Yes, get this app back up!")
              if btn.count():
                  btn.click()
                  print("App was asleep, woke it up")
              page.wait_for_timeout(20000)  # stay long enough to count as a visit
              print("Visited:", page.title())
          EOF